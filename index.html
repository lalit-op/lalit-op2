<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#020817"
    >

    <meta
        name="description"
        content="US Market AI - Daily US stock market intelligence, S&P 500, Nasdaq and Dow Jones reports."
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <title>
        US Market AI | Daily US Market Reports
    </title>


    <style>

        /* =====================================================
           GLOBAL
        ===================================================== */

        :root {
            --background: #020817;
        }


        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background:
                var(--background);

            overflow: hidden;

            -webkit-text-size-adjust: 100%;
        }


        body {

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            color: #e2e8f0;
        }


        /* =====================================================
           FULLSCREEN REPORT CONTAINER
        ===================================================== */

        .page-container {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background:
                #020817;
        }


        /* =====================================================
           REPORT WEBSITE IFRAME
        ===================================================== */

        .market-frame {

            width: 100%;
            height: 100%;

            display: block;

            border: 0;

            margin: 0;
            padding: 0;

            background:
                #020817;

            -webkit-tap-highlight-color:
                transparent;
        }


        /* =====================================================
           LOADING SCREEN
        ===================================================== */

        .loading-screen {

            position: fixed;

            inset: 0;

            z-index: 1000;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-direction: column;

            gap: 14px;

            background:
                #020817;

            transition:
                opacity 0.4s ease,
                visibility 0.4s ease;
        }


        .loading-screen.hidden {

            opacity: 0;

            visibility: hidden;

            pointer-events: none;
        }


        .loading-dot {

            width: 12px;
            height: 12px;

            border-radius: 50%;

            background:
                #22c55e;

            box-shadow:
                0 0 20px
                rgba(34, 197, 94, 0.8);

            animation:
                loadingPulse 1.2s infinite;
        }


        .loading-text {

            color:
                #64748b;

            font-size:
                13px;

            letter-spacing:
                0.08em;

            text-transform:
                uppercase;
        }


        @keyframes loadingPulse {

            0% {

                transform:
                    scale(1);

                opacity:
                    1;
            }

            50% {

                transform:
                    scale(1.35);

                opacity:
                    0.45;
            }

            100% {

                transform:
                    scale(1);

                opacity:
                    1;
            }
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            html,
            body {

                width: 100%;

                height: 100%;

                overflow: hidden;
            }


            .page-container {

                inset: 0;

                width: 100%;
                height: 100%;
            }


            .market-frame {

                width: 100%;
                height: 100%;
            }

        }


        /* =====================================================
           SAFE AREA
        ===================================================== */

        @supports (
            padding: env(safe-area-inset-top)
        ) {

            .page-container {

                padding-top:
                    env(safe-area-inset-top);

                padding-bottom:
                    env(safe-area-inset-bottom);
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         LOADING
    ===================================================== -->

    <div
        id="loading"
        class="loading-screen"
    >

        <div class="loading-dot"></div>

        <div class="loading-text">
            Loading US Market AI
        </div>

    </div>


    <!-- =====================================================
         MARKET DASHBOARD
    ===================================================== -->

    <main class="page-container">

        <iframe

            id="market-frame"

            class="market-frame"

            src="https://lalit-op.github.io/lalit-op2/posts/"

            title="US Market AI Daily Market Reports"

            allow="
                clipboard-read;
                clipboard-write;
                display-capture;
                fullscreen
            "

            allowfullscreen

            referrerpolicy="origin"

        ></iframe>

    </main>


    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script>

        const frame =
            document.getElementById(
                "market-frame"
            );


        const loading =
            document.getElementById(
                "loading"
            );


        /*
         * Hide loading screen after
         * dashboard loads.
         */

        frame.addEventListener(
            "load",
            function () {

                setTimeout(
                    function () {

                        loading.classList.add(
                            "hidden"
                        );

                    },
                    250
                );

            }
        );


        /*
         * Fallback in case the iframe
         * load event takes longer.
         */

        setTimeout(
            function () {

                loading.classList.add(
                    "hidden"
                );

            },
            5000
        );

    </script>


</body>

</html>
