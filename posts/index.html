<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>US Market AI - Daily Reports</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        Inter,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at top left,
            #1e3a8a55,
            transparent 40%
        ),
        radial-gradient(
            circle at top right,
            #06b6d455,
            transparent 40%
        ),
        #020617;

    color: #e2e8f0;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 25px;
}

.header {
    text-align: center;
    padding: 45px 20px;
    margin-bottom: 25px;

    border-radius: 24px;

    background: rgba(255,255,255,0.05);

    border: 1px solid rgba(255,255,255,0.08);

    backdrop-filter: blur(20px);
}

.badge {
    display: inline-block;

    padding: 8px 15px;

    border-radius: 999px;

    color: #38bdf8;

    background: rgba(14,165,233,0.12);

    border: 1px solid rgba(56,189,248,0.25);

    font-size: 14px;
}

h1 {
    margin: 18px 0 10px;

    font-size: 46px;

    background:
        linear-gradient(
            90deg,
            #38bdf8,
            #22c55e,
            #facc15
        );

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;
}

.subtitle {
    color: #94a3b8;

    font-size: 17px;
}

.report-card {
    margin-bottom: 15px;

    padding: 22px;

    border-radius: 20px;

    background: rgba(15,23,42,0.85);

    border: 1px solid rgba(255,255,255,0.08);

    transition: 0.2s;
}

.report-card:hover {
    transform: translateY(-3px);

    border-color: rgba(56,189,248,0.35);
}

.report-card a {
    color: #38bdf8;

    text-decoration: none;

    font-size: 22px;

    font-weight: 700;
}

.date {
    margin-top: 8px;

    color: #94a3b8;

    font-size: 14px;
}

@media (max-width: 768px) {

    .container {
        padding: 15px;
    }

    .header {
        padding: 30px 15px;
    }

    h1 {
        font-size: 32px;
    }

    .report-card a {
        font-size: 18px;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <div class="badge">
            🇺🇸 AI-Powered US Market Intelligence
        </div>

        <h1>
            US Market AI
        </h1>

        <div class="subtitle">
            Daily S&P 500, Nasdaq & Dow Jones Market Reports
        </div>

    </div>

    
        <article class="report-card">

            <a href="2026-08-21.html">
                🇺🇸 US Market Report - 2026-08-21
            </a>

            <div class="date">
                📅 Published on 2026-08-21
            </div>

        </article>
        

</div>

</body>

</html>
